version: 2
updates:
  # Root Go module. Grouped so a week's updates arrive as one PR; a bump that
  # raises the required Go toolchain past go.mod's `go` directive should be pinned
  # deliberately, not chased blindly.
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-modules:
        patterns:
          - "*"

  # The control-plane Go module (separate go.mod).
  - package-ecosystem: gomod
    directory: "/controlplane"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      controlplane-go-modules:
        patterns:
          - "*"

  # The control-plane web frontend (npm).
  - package-ecosystem: npm
    directory: "/controlplane/web"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web-npm-dependencies:
        patterns:
          - "*"

  # GitHub Actions used by the workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
